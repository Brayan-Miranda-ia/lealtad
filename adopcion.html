<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adopcion.css">
    <title>Lealtad Canina</title>
</head>
<body>
  <div class="principal">
    
    <marquee >click en los formularios</marquee>

    <header> 
      <div class="formularios">
      <a href="index.html">Inicio</a>
      <a href="formulario-crear-cuenta.html">Formulario crear cuenta</a>
      <a href="adopcion.html">Formulario de adopcion</a>
      <a href="rescate.html">Formulario de mascota perdida</a>
      <a href="citas.html">Formulario de cita veterinaria</a>
      </div>
    
    </header>

    <main>

      <div class="fondo">
      <img src="Imagenes/Golden Retriever en Fondo Azul Pastel.png" alt="">
     </div>
      
     <div class="fondito">
      <img src="Imagenes/Fondo pastel con huellas de perro.png" alt="">
     </div>

      <img  class="logo" src="Imagenes/Logo Lealtad Canina con Huellas.png" alt="">

      <div class="mensaje" >
        <h1>¡Formulario de adopcion!</h1>
        <p>Dale una segunda oportunidad a un amigo fiel <br> completa el formulario y se parte de su historia</p>
      </div>

    <form action="">
         <input placeholder="👤​Nombre completo" type="text">
         <input  placeholder="Edad" type="number">
         <input type="date">
         <input placeholder="✉️Correo electronico" type="email">
         <input placeholder="📱Telefono" type="tel">
         <input  placeholder="Direccion" type="text">

       
             <label for="mascota">🐾 Selecciona la mascota que deseas adoptar</label>

            <select name="mascota" id="mascota" required>

               <option value="">Selecciona una mascota</option>

               <option value="perro">🐶 Perro</option>

               <option value="cachorro">🐕 Cachorro</option>

               <option value="cualquiera">❤️ No tengo preferencia</option>

            </select>
       <button>Registrarse</button>

    </form>


    </main>
